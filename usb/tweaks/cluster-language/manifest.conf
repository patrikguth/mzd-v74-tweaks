target=/jci/sm/sm.conf
oem_backup_md5=74d9fc389b74fb01d0cfc2615a82c782
lock_group=sm-config
status_scope=payload
reboot_required=true
requires=
conflicts=
reset_entrypoint=reset.sh
components=components.tsv
settings=hud_display_language
setting.hud_display_language.type=choice
setting.hud_display_language.label=Cluster / HUD language
setting.hud_display_language.default=english
setting.hud_display_language.options=off english
setting.hud_display_language.help=english forces English (UK); off passes through the normal CMU language code. Changes cluster/HUD texts, not the CMU interface.
